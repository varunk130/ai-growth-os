<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="AI Growth OS — an agentic Growth Experiment Engine. Six agents find a funnel leak, design and ship an experiment, call the result with a significance test, and compound every win into the next cycle. Codename Compound. Synthetic data, runs offline.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#08090C"/>
    </linearGradient>
    <radialGradient id="glowA" cx="80%" cy="-8%" r="60%">
      <stop offset="0" stop-color="#B8FF3D" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#B8FF3D" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="4%" cy="2%" r="50%">
      <stop offset="0" stop-color="#5EEAD4" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FCB2E"/>
      <stop offset="0.5" stop-color="#B8FF3D"/>
      <stop offset="1" stop-color="#D4FF85"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D7E8C4"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1280" height="440"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1280" height="440" fill="url(#bg)"/>
    <rect width="1280" height="440" fill="url(#glowA)"/>
    <rect width="1280" height="440" fill="url(#glowB)"/>

    <!-- technical grid (Compound signature) -->
    <g stroke="#FFFFFF" stroke-opacity="0.035">
      <path d="M820 40 H1240 M820 84 H1240 M820 128 H1240 M820 172 H1240 M820 216 H1240 M820 260 H1240 M820 304 H1240 M820 348 H1240"/>
      <path d="M828 36 V356 M872 36 V356 M916 36 V356 M960 36 V356 M1004 36 V356 M1048 36 V356 M1092 36 V356 M1136 36 V356 M1180 36 V356 M1224 36 V356"/>
    </g>

    <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

    <!-- eyebrow -->
    <g transform="translate(74,104)">
      <rect x="0" y="-9" width="9" height="9" rx="2" fill="#B8FF3D"/>
      <text x="20" y="0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="3" fill="#D4FF85">AGENTIC GROWTH ENGINE · CODENAME COMPOUND</text>
    </g>

    <!-- title -->
    <text x="71" y="194" font-family="'Outfit','Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="80" font-weight="800" letter-spacing="-1.5" fill="url(#title)">AI Growth OS</text>
    <rect x="76" y="212" width="200" height="5" rx="2.5" fill="url(#accent)"/>

    <!-- tagline + subline -->
    <text x="75" y="252" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="22" font-weight="500" fill="#CFE0C2">An agentic Growth Experiment Engine.</text>
    <text x="75" y="282" font-family="'Segoe UI',system-ui,-apple-system,Arial,sans-serif" font-size="15" fill="#8F9CB0">Six agents find the leak, ship the test, and compound every win into the next cycle.</text>

    <!-- chips -->
    <g transform="translate(75,306)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
      <g>
        <rect x="0" y="0" width="138" height="30" rx="15" fill="#101318" stroke="#B8FF3D" stroke-opacity="0.45"/>
        <circle cx="18" cy="15" r="4" fill="#B8FF3D"/>
        <text x="31" y="19" fill="#DDEBC8">Experiment loop</text>
      </g>
      <g transform="translate(150,0)">
        <rect x="0" y="0" width="166" height="30" rx="15" fill="#101318" stroke="#5EEAD4" stroke-opacity="0.45"/>
        <circle cx="18" cy="15" r="4" fill="#5EEAD4"/>
        <text x="31" y="19" fill="#CDEDE6">Significance-tested</text>
      </g>
      <g transform="translate(328,0)">
        <rect x="0" y="0" width="168" height="30" rx="15" fill="#101318" stroke="#8FCB2E" stroke-opacity="0.45"/>
        <circle cx="18" cy="15" r="4" fill="#8FCB2E"/>
        <text x="31" y="19" fill="#DDEBC8">Compounding memory</text>
      </g>
    </g>

    <!-- ===== right: compounding loop of six agents ===== -->
    <circle cx="1006" cy="200" r="92" fill="none" stroke="#B8FF3D" stroke-opacity="0.38" stroke-width="2"/>
    <!-- center -->
    <text x="1006" y="212" text-anchor="middle" font-family="'Segoe UI',system-ui,Arial,sans-serif" font-size="48" font-weight="700" fill="#B8FF3D">&#8734;</text>
    <text x="1006" y="240" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="2" fill="#8FCB2E">&#8635; COMPOUNDS</text>
    <!-- nodes -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="600">
      <g><circle cx="1006" cy="108" r="15" fill="#101318" stroke="#B8FF3D" stroke-opacity="0.7"/><text x="1006" y="112" text-anchor="middle" fill="#DDEBC8">FA</text></g>
      <g><circle cx="1086" cy="154" r="15" fill="#101318" stroke="#5EEAD4" stroke-opacity="0.7"/><text x="1086" y="158" text-anchor="middle" fill="#CDEDE6">HW</text></g>
      <g><circle cx="1086" cy="246" r="15" fill="#101318" stroke="#B8FF3D" stroke-opacity="0.7"/><text x="1086" y="250" text-anchor="middle" fill="#DDEBC8">PZ</text></g>
      <g><circle cx="1006" cy="292" r="15" fill="#101318" stroke="#B8FF3D" stroke-opacity="0.7"/><text x="1006" y="296" text-anchor="middle" fill="#DDEBC8">ED</text></g>
      <g><circle cx="926" cy="246" r="15" fill="#101318" stroke="#5EEAD4" stroke-opacity="0.7"/><text x="926" y="250" text-anchor="middle" fill="#CDEDE6">VS</text></g>
      <g><circle cx="926" cy="154" r="15" fill="#101318" stroke="#B8FF3D" stroke-opacity="0.7"/><text x="926" y="158" text-anchor="middle" fill="#DDEBC8">RO</text></g>
    </g>
    <text x="1006" y="372" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" letter-spacing="1.2" fill="#6E7A66">find &#8594; design &#8594; ship &#8594; learn</text>

    <!-- bottom ribbon -->
    <rect x="0" y="392" width="1280" height="48" fill="#0A0C0F"/>
    <rect x="0" y="392" width="1280" height="1" fill="#B8FF3D" fill-opacity="0.16"/>
    <text x="75" y="421" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="1.2" fill="#8F9CB0">Built by Varun Kulkarni · synthetic data · runs offline · no API keys</text>
    <g transform="translate(1088,404)">
      <rect x="0" y="0" width="118" height="24" rx="12" fill="#101318" stroke="#B8FF3D" stroke-opacity="0.4"/>
      <text x="59" y="16" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#D4FF85">npm run dev</text>
    </g>
  </g>
</svg>
